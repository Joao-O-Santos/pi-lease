image: node:22

stages: [test, publish]

check:
  stage: test
  script:
    - apt-get update
    - apt-get install --yes curl
    - curl --fail --location --output /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.10.1/pandoc-3.10.1-1-amd64.deb
    - echo 'b419369915e0f3181be0afdb040ec8ecc6b70e72e5992652a0d83aed9e6bc109  /tmp/pandoc.deb' | sha256sum --check
    - dpkg --install /tmp/pandoc.deb
    - npm ci
    - npm run check
    - npm pack --dry-run
    - npm audit --omit=dev

publish:
  stage: publish
  needs: [check]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm install --global npm@11.16.0
    - test "$CI_COMMIT_TAG" = "v$(node -p 'require("./package.json").version')"
    - npm publish --access public --provenance
