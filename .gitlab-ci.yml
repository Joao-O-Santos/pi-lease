image: node:22

stages: [test, publish]

check:
  stage: test
  script:
    - npm ci
    - npm run check
    - npm pack --dry-run
    - npm audit --omit=dev

publish:
  stage: publish
  needs: [check]
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  script:
    - npm install --global npm@11
    - test "$CI_COMMIT_TAG" = "v$(node -p 'require("./package.json").version')"
    - npm publish --access public --provenance
